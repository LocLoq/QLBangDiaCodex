[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "normastore"
version = "0.1.0"
description = "Ứng dụng desktop quản lý băng đĩa NormaStore"
requires-python = ">=3.13,<3.14"
dependencies = [
  "SQLAlchemy>=2.0.36,<3",
  "PyMySQL>=1.1.1,<2",
  "alembic>=1.14,<2",
  "ttkbootstrap>=1.10,<2",
  "Pillow>=11,<12",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.6,<3",
  "google-genai>=1.0,<2",
  "numpy>=2.2,<3",
  "matplotlib>=3.10,<4",
  "reportlab>=4.2,<5",
  "argon2-cffi>=23.1,<26",
  "keyring>=25,<27",
  "platformdirs>=4.3,<5",
  "tzdata>=2025.2,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
normastore = "normastore.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
